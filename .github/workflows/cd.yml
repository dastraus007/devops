name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js ${{ matrix.service }}
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies for ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: npm ci

      # Only run lint if you’ve added it to package.json:
      - name: Lint ${{ matrix.service }}
        if: ${{ hashFiles(format('{0}/package.json', matrix.service)) != '' && contains(fromJson(runner.os), 'Linux') }} # simple guard
        working-directory: ./${{ matrix.service }}
        run: npm run lint || echo "no lint script, skipping"

      - name: Test ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: npm test
