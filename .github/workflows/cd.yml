# .github/workflows/cd.yml
name: CD

on:
  push:
    branches: [ test-2 ]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker Hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            dastraus007/notes-app-frontend:latest
            dastraus007/notes-app-backend:latest

      - name: Set up SSH for deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Bootstrap VM (install Docker & Compose)
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            sudo apt update
            sudo apt install -y docker.io docker-compose
            sudo usermod -aG docker $USER
          EOF

      - name: Copy docker-compose.yml to server
        run: |
          scp -i ~/.ssh/id_ed25519 \
            docker-compose.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/notes-app/

      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ~/notes-app
            docker-compose pull
            docker-compose down
            docker-compose up -d --remove-orphans
          EOF
