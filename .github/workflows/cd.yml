name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v3

      # 2) Log in to Docker Hub
      - name: Docker Hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3) Build & push your images
      - name: Build & push images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            dastraus007/notes-app-frontend:latest
            dastraus007/notes-app-backend:latest

      # 4) Prepare SSH (write key & known_hosts)
      - name: Set up SSH for deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      # 5) Copy docker-compose.yml to the server
      - name: Copy compose file
        run: |
          scp -i ~/.ssh/id_ed25519 \
            docker-compose.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:~/notes-app/

      # 6) SSH in and deploy
      - name: Deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd ~/notes-app
            docker-compose pull
            docker-compose down
            docker-compose up -d --remove-orphans
          EOF
