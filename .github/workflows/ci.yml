name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # 1) log in to Docker Hub
      - name: Docker Hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 2) build & push both images
      - name: Build & push images
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # adjust your tags as needed:
          tags: |
            dastraus007/notes-app-frontend:latest
            dastraus007/notes-app-backend:latest

      # 3) copy only your compose file up to the VM
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.SERVER_USER }}/notes-app/

      # 4) SSH in, pull new images & restart
      - name: SSH & deploy
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd notes-app
            docker-compose pull
            docker-compose down
            docker-compose up -d --remove-orphans
