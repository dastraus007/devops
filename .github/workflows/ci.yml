name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend]

    steps:
      # 1) Check out the code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2) Set up Node.js
      - name: Use Node.js ${{ matrix.service }}
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # 3) Install dependencies
      - name: Install dependencies for ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: npm ci

      # 4) (Optional) Lint, if you have a lint script and are on Linux
      - name: Lint ${{ matrix.service }}
        if: ${{ hashFiles(format('{0}/package.json', matrix.service)) != '' && contains(runner.os, 'Linux') }}
        working-directory: ./${{ matrix.service }}
        run: npm run lint || echo "no lint script, skipping"

      # 5) Run tests only if a "test" script is defined
      - name: Test ${{ matrix.service }}
        working-directory: ./${{ matrix.service }}
        run: npm run test --if-present
